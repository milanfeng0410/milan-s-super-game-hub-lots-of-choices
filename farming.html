<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harvest Valley</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial;text-align:center;}
#wrap{display:inline-block;margin-top:12px;position:relative;}
canvas{border:2px solid #fff;display:block;}
#ui{font-size:15px;margin:8px 0;min-height:20px;}
#hint{font-size:13px;color:#ccc;margin:8px;}
#hint a{color:#7fd0ff;}
#shop{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);}
#shopInner{margin:50px auto;width:440px;background:#3a2f1f;border:2px solid #a08040;padding:16px;box-sizing:border-box;}
#shopInner h2{margin:0 0 10px;color:#ffd84d;}
.srow{display:flex;justify-content:space-between;align-items:center;margin:6px 0;}
button{padding:5px 10px;cursor:pointer;background:#f1c40f;border:1px solid #b8860b;color:#222;font-weight:bold;}
#close{width:100%;margin-top:14px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="768" height="448"></canvas>
  <div id="shop">
    <div id="shopInner">
      <h2>General Store</h2>
      <div class="srow"><span>Turnip Seeds (2 days)</span><span>5g</span><button onclick="buy('turnip')">Buy</button></div>
      <div class="srow"><span>Tomato Seeds (4 days)</span><span>15g</span><button onclick="buy('tomato')">Buy</button></div>
      <div class="srow"><span>Corn Seeds (5 days)</span><span>30g</span><button onclick="buy('corn')">Buy</button></div>
      <hr style="border-color:#6a5530;">
      <div class="srow"><span>Turnips</span><span id="iturnip">0</span><button onclick="sell('turnip')">Sell 15g</button></div>
      <div class="srow"><span>Tomatoes</span><span id="itomato">0</span><button onclick="sell('tomato')">Sell 40g</button></div>
      <div class="srow"><span>Corn</span><span id="icorn">0</span><button onclick="sell('corn')">Sell 90g</button></div>
      <button id="close" onclick="closeShop()">Close (Space)</button>
    </div>
  </div>
</div>
<div id="ui"></div>
<div id="hint">
  Arrows/WASD move &bull; Space use tool &bull; 1 Hoe &nbsp;2 Water &nbsp;3 Harvest &nbsp;4 Seeds &bull; Q/E switch seed type<br>
  Shop: red stall top-left &bull; Bed: tile below the shop &nbsp;&nbsp;<a href="index.html">&larr; Back to Hub</a>
</div>
<script>
const ROWS=7, COLS=12, TILE=64;
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const ui=document.getElementById("ui");
const shopEl=document.getElementById("shop");

const CROPS={
  turnip:{name:"Turnip",grow:2,buy:5,sell:15,color:"#fff0c0"},
  tomato:{name:"Tomato",grow:4,buy:15,sell:40,color:"#ff4040"},
  corn:{name:"Corn",grow:5,buy:30,sell:90,color:"#ffd84d"}
};
const SEEDORDER=["turnip","tomato","corn"];

const field=[];
for(let r=0;r<ROWS;r++){
  field.push([]);
  for(let c=0;c<COLS;c++)field[r].push(null);
}

let money=50;
let day=1;
let seedCount={turnip:2,tomato:0,corn:0};
let inv={turnip:0,tomato:0,corn:0};
let tool="hoe";
let seedType="turnip";
let shopOpen=false;

const player={c:6,r:5,px:6*TILE,py:5*TILE,tx:6*TILE,ty:5*TILE,dir:2,moving:false};

const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];

function isSpecial(c,r){
  return (c===0&&r===0)||(c===0&&r===1);
}

function facingTile(){
  return [player.c+DIRS[player.dir][0], player.r+DIRS[player.dir][1]];
}

function action(){
  const fc=facingTile()[0], fr=facingTile()[1];
  const onShop=player.c===0&&player.r===0;
  const onBed=player.c===0&&player.r===1;
  if(onShop||(fc===0&&fr===0)){openShop();return;}
  if(onBed||(fc===0&&fr===1)){sleep();return;}
  if(isSpecial(fc,fr)||isSpecial(player.c,player.r))return;
  const t=field[fr][fc];
  if(tool==="hoe"){
    if(!t)field[fr][fc]={tilled:true,type:null,stage:0,watered:false};
  }else if(tool==="water"){
    if(t&&t.type)t.watered=true;
  }else if(tool==="harvest"){
    if(t&&t.type&&t.stage>=CROPS[t.type].grow){
      inv[t.type]++;
      field[fr][fc]={tilled:true,type:null,stage:0,watered:false};
    }
  }else if(tool==="seed"){
    if(t&&t.tilled&&!t.type&&seedCount[seedType]>0){
      t.type=seedType;
      t.stage=0;
      t.watered=false;
      seedCount[seedType]--;
    }
  }
}

let sleepTimer=0;
let sleepMsg="";

function sleep(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const t=field[r][c];
    if(t&&t.type){
      if(t.watered&&t.stage<CROPS[t.type].grow)t.stage++;
      t.watered=false;
    }
  }
  day++;
  sleepMsg="Day "+day;
  sleepTimer=1.8;
}

function move(dir){
  if(player.moving||shopOpen)return;
  player.dir=dir;
  const nc=player.c+DIRS[dir][0];
  const nr=player.r+DIRS[dir][1];
  if(nc<0||nr<0||nc>=COLS||nr>=ROWS)return;
  player.c=nc;player.r=nr;
  player.tx=nc*TILE;player.ty=nr*TILE;
  player.moving=true;
}

document.addEventListener("keydown",e=>{
  if(shopOpen){
    if(e.code==="Space"||e.code==="Escape")closeShop();
    return;
  }
  const k=e.code;
  if(k==="Space"){
    if(!e.repeat)action();
    return;
  }
  if(k==="ArrowUp"||k==="KeyW")move(0);
  else if(k==="ArrowRight"||k==="KeyD")move(1);
  else if(k==="ArrowDown"||k==="KeyS")move(2);
  else if(k==="ArrowLeft"||k==="KeyA")move(3);
  else if(k==="Digit1")tool="hoe";
  else if(k==="Digit2")tool="water";
  else if(k==="Digit3")tool="harvest";
  else if(k==="Digit4")tool="seed";
  else if(k==="KeyQ")seedType=SEEDORDER[(SEEDORDER.indexOf(seedType)+SEEDORDER.length-1)%SEEDORDER.length];
  else if(k==="KeyE")seedType=SEEDORDER[(SEEDORDER.indexOf(seedType)+1)%SEEDORDER.length];
});

function openShop(){
  shopOpen=true;
  shopEl.style.display="block";
  refreshShop();
}
function closeShop(){
  shopOpen=false;
  shopEl.style.display="none";
}
function refreshShop(){
  document.getElementById("iturnip").textContent=inv.turnip;
  document.getElementById("itomato").textContent=inv.tomato;
  document.getElementById("icorn").textContent=inv.corn;
}
function buy(k){
  if(money>=CROPS[k].buy){money-=CROPS[k].buy;seedCount[k]++;}
  refreshShop();
}
function sell(k){
  if(inv[k]>0){inv[k]--;money+=CROPS[k].sell;}
  refreshShop();
}

function toolLabel(){
  if(tool==="hoe")return "Hoe";
  if(tool==="water")return "Watering Can";
  if(tool==="harvest")return "Hands";
  return "Seeds";
}

function drawCrop(x,y,t){
  const info=CROPS[t.type];
  const cx=x+TILE/2, cy=y+TILE/2;
  const h=8+Math.min(1,t.stage/info.grow)*22;
  ctx.fillStyle="#2f8f2f";
  ctx.fillRect(cx-3,cy+12-h,6,h);
  if(t.stage>0){
    ctx.fillStyle="#3fbf3f";
    ctx.beginPath();
    ctx.ellipse(cx-8,cy+8-h*0.6,6,3,0,0,Math.PI*2);
    ctx.ellipse(cx+8,cy+8-h*0.6,6,3,0,0,Math.PI*2);
    ctx.fill();
  }
  if(t.stage>=info.grow){
    ctx.fillStyle=info.color;
    ctx.beginPath();
    ctx.arc(cx,cy-6,7,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="#fff";
    ctx.font="10px Arial";
    ctx.fillText("!",cx-3,cy-3);
  }
}

function drawShop(){
  const px=0,py=0;
  ctx.fillStyle="#7a4a1e";
  ctx.fillRect(px,py+20,TILE,TILE-20);
  ctx.fillStyle="#c0392b";
  ctx.fillRect(px,py,TILE,18);
  ctx.fillStyle="#f1c40f";
  ctx.font="bold 12px Arial";
  ctx.fillText("SHOP",px+10,py+42);
}

function drawBed(){
  const px=0,py=TILE;
  ctx.fillStyle="#8e44ad";
  ctx.fillRect(px,py+8,TILE,TILE-8);
  ctx.fillStyle="#ecf0f1";
  ctx.fillRect(px+6,py+14,34,8);
  ctx.fillStyle="#fff";
  ctx.font="11px Arial";
  ctx.fillText("SLEEP",px+44,py+32);
}

function drawPlayer(){
  const px=player.px,py=player.py;
  ctx.fillStyle="#f6c179";
  ctx.fillRect(px+18,py+6,28,28);
  ctx.fillStyle="#4a86c8";
  ctx.fillRect(px+12,py+32,40,24);
  ctx.fillStyle="#2c2c2c";
  ctx.fillRect(px+16,py+54,12,10);
  ctx.fillRect(px+36,py+54,12,10);
  ctx.fillStyle="#e8d8b8";
  ctx.fillRect(px+34,py+36,14,8);
}

function bubble(c,r,label){
  const cx=c*TILE+TILE/2, cy=r*TILE;
  ctx.font="bold 11px Arial";
  const w=ctx.measureText(label).width+12;
  ctx.fillStyle="rgba(0,0,0,.7)";
  ctx.fillRect(cx-w/2,cy-28,w,17);
  ctx.strokeStyle="#ffd84d";
  ctx.strokeRect(cx-w/2+.5,cy-28+.5,w-1,16);
  ctx.fillStyle="#fff";
  ctx.fillText(label,cx-w/2+6,cy-16);
}

function near(x,y){
  return Math.abs(player.c-x)+Math.abs(player.r-y)<=1;
}

function draw(){
  ctx.fillStyle="#6a8f2a";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const x=c*TILE,y=r*TILE;
    ctx.strokeStyle="rgba(0,0,0,.12)";
    ctx.strokeRect(x+.5,y+.5,TILE,TILE);
    const t=field[r][c];
    if(t){
      if(t.watered)ctx.fillStyle=t.type?"#5a3b1a":"#6a4a22";
      else ctx.fillStyle=t.type?"#7a4f24":"#8a5a2b";
      ctx.fillRect(x+2,y+2,TILE-4,TILE-4);
      if(t.type)drawCrop(x,y,t);
    }
  }
  drawShop();
  drawBed();
  if(near(0,0))bubble(0,0,"SPACE: SHOP");
  if(near(0,1))bubble(0,1,"SPACE: SLEEP");
  drawPlayer();
  if(sleepTimer>0){
    ctx.fillStyle="rgba(0,0,0,.55)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#ffd84d";
    ctx.font="bold 42px Arial";
    ctx.textAlign="center";
    ctx.fillText(sleepMsg,canvas.width/2,canvas.height/2);
    ctx.fillStyle="#fff";
    ctx.font="15px Arial";
    ctx.fillText("Zzz...",canvas.width/2,canvas.height/2+30);
    ctx.textAlign="left";
  }
  ui.textContent="Day "+day+"  |  Gold: "+money+"g  |  Tool: "+toolLabel()
    +(tool==="seed"?" ("+seedType+")":"")
    +"  |  Seeds: turnip "+seedCount.turnip+" tomato "+seedCount.tomato+" corn "+seedCount.corn;
}

let last=performance.now();
function loop(t){
  const dt=Math.min((t-last)/1000,0.05);
  last=t;
  if(player.moving){
    const dx=player.tx-player.px,dy=player.ty-player.py;
    const d=Math.hypot(dx,dy);
    const step=360*dt;
    if(d<=step){player.px=player.tx;player.py=player.ty;player.moving=false;}
    else{player.px+=dx/d*step;player.py+=dy/d*step;}
  }
  if(sleepTimer>0)sleepTimer-=dt;
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
