<script>


const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");


let mode="";

let keys={};



const menu=document.getElementById("menu");

const back=document.getElementById("back");




document.addEventListener("keydown",e=>{


keys[e.code]=true;



if(mode=="minecraft" && e.code=="KeyW"){

jumpMC();

}



if(mode=="geometry" && e.code=="Space" && !e.repeat){

jumpGD();

}



if(mode=="soccer" && e.code=="Space" && !e.repeat){

soccerShoot();

}

if(mode=="arrow" && !e.repeat && (e.code=="Space"||e.code=="KeyW"||e.code=="ArrowUp")){

jumpArrow();

}

if(mode=="snake3" && e.code.indexOf("Arrow")===0){

e.preventDefault();

}

});




document.addEventListener("keyup",e=>{

keys[e.code]=false;

});






function startGame(g){


mode=g;


menu.style.display="none";

back.style.display="block";

canvas.style.display="block";



if(g=="minecraft"){

startMinecraft();

}



if(g=="geometry"){

startGeometry();

}



if(g=="soccer"){

startSoccer();

}

if(g=="arrow"){

startArrow();

}

if(g=="memory"){

startMemory();

}

if(g=="match3"){

startMatch3();

}

if(g=="puzzle"){

startPuzzle();

}

if(g=="snake3"){

startSnake3();

}


} 





function backMenu(){


mode="";


menu.style.display="block";

back.style.display="none";

canvas.style.display="none";


}







// =============================
// MINECRAFT V3 PART 1
// =============================



const TILE=25;


let blocks=[];

let camera=0;


let selectedBlock="dirt";



let blockColors={


grass:"#35b84a",

dirt:"#8b4513",

stone:"#777",

wood:"#9b6b30",

leaf:"#228b22",

coal:"#222",

iron:"#ccc"


};





let mcPlayer={


x:200,

y:150,

vy:0,


hp:100


};







function startMinecraft(){


blocks=[];



for(let x=0;x<160;x++){


let ground=Math.round((300-Math.random()*30)/TILE)*TILE;



blocks.push({

x:x*TILE,

y:ground,

type:"grass"

});




for(let i=1;i<5;i++){


blocks.push({

x:x*TILE,

y:ground+i*TILE,

type:"dirt"

});


}




for(let i=5;i<9;i++){


let type="stone";


if(Math.random()<0.1)

type="coal";


if(Math.random()<0.05)

type="iron";



blocks.push({

x:x*TILE,

y:ground+i*TILE,

type:type

});


}


}




// trees

for(let x=8;x<150;x+=15){


blocks.push({

x:x*TILE,

y:Math.round(220/TILE)*TILE,

type:"wood"

});


for(let a=-1;a<=1;a++){


blocks.push({

x:x*TILE+a*TILE,

y:Math.round(195/TILE)*TILE,

type:"leaf"

});


}


}



mcPlayer.x=200;

mcPlayer.y=150;

mcPlayer.vy=0;


}







// block selection

document.addEventListener("keydown",e=>{


if(e.code=="Digit1")

selectedBlock="dirt";


if(e.code=="Digit2")

selectedBlock="stone";


if(e.code=="Digit3")

selectedBlock="wood";


if(e.code=="Digit4")

selectedBlock="leaf";


});







// FIXED MINING


canvas.oncontextmenu=e=>e.preventDefault();



canvas.onmousedown=function(e){



if(mode!="minecraft")

return;



let rect=canvas.getBoundingClientRect();



let mx=e.clientX-rect.left+camera;

let my=e.clientY-rect.top;



let bx=Math.floor(mx/TILE)*TILE;

let by=Math.floor(my/TILE)*TILE;



let reach=Math.sqrt(

(mcPlayer.x+12-bx-12.5)**2+

(mcPlayer.y+17-by-12.5)**2

);



if(reach>250)

return;




if(e.button===0){


// mine

blocks=blocks.filter(b=>{

return !(b.x==bx && b.y==by);


});


}



if(e.button===2){


// build

let found=blocks.some(b=>{

return b.x==bx && b.y==by;

});


if(!found){


blocks.push({

x:bx,

y:by,

type:selectedBlock


});


}



}


};
function jumpMC(){

if(mcPlayer.vy==0){

mcPlayer.vy=-13;

}

}





function updateMinecraft(){


if(keys["KeyA"])
mcPlayer.x-=4;


if(keys["KeyD"])
mcPlayer.x+=4;



mcPlayer.vy+=0.6;

mcPlayer.y+=mcPlayer.vy;



let onGround=false;



blocks.forEach(b=>{


if(

mcPlayer.x+20>b.x &&

mcPlayer.x<b.x+25 &&

mcPlayer.y+35>b.y &&

mcPlayer.y+35<b.y+20

){


mcPlayer.y=b.y-35;

mcPlayer.vy=0;

onGround=true;


}



});




camera=mcPlayer.x-450;


if(camera<0)

camera=0;


}






function drawMinecraft(){


ctx.fillStyle="#70cfff";

ctx.fillRect(

0,

0,

900,

500

);



ctx.save();

ctx.translate(-camera,0);



blocks.forEach(b=>{


ctx.fillStyle=blockColors[b.type];


ctx.fillRect(

b.x,

b.y,

25,

25

);



ctx.strokeStyle="#000";

ctx.strokeRect(

b.x,

b.y,

25,

25

);



});





ctx.fillStyle="orange";


ctx.fillRect(

mcPlayer.x,

mcPlayer.y,

25,

35

);



ctx.restore();



ctx.fillStyle="white";

ctx.font="22px Arial";


ctx.fillText(

"⛏ Block: "+selectedBlock,

20,

30

);



}









// =============================
// GEOMETRY DASH V3 EASY MODE
// =============================


let gdPlayer={
x:120,
y:330,
vy:0,
onGround:true
};

let gdObjects=[];

let gdScore=0;

let gdDead=false;

let gdSpeed=6;

let gdMode="cube";

let gdGravity=1;

let genMode="cube";





function obstacleWidth(o){
if(o.type=="block"||o.type=="tall"||o.type=="ceilblock")return 70;
if(o.type=="spikewall")return o.n*35;
if(o.type=="spike"||o.type=="ceilspike")return 35;
return 18;
}





function hOverlap(o){
const w=obstacleWidth(o);
return gdPlayer.x+35>o.x&&gdPlayer.x<o.x+w;
}





function makeCubeObstacle(x){
const r=Math.random();
if(r<0.42)return {x:x,type:"spike"};
if(r<0.62)return {x:x,type:"block"};
if(r<0.80)return {x:x,type:"spikewall",n:2+Math.floor(Math.random()*2)};
return {x:x,type:"tall"};
}





function makeShipObstacle(x){
const r=Math.random();
if(r<0.30)return {x:x,type:"spikewall",n:3+Math.floor(Math.random()*2)};
if(r<0.55)return {x:x,type:"tall"};
if(r<0.80)return {x:x,type:"ceilspike"};
return {x:x,type:"ceilblock"};
}





function makeBallObstacle(x){
const r=Math.random();
if(r<0.35)return {x:x,type:"spikewall",n:2+Math.floor(Math.random()*2)};
if(r<0.60)return {x:x,type:"tall"};
if(r<0.85)return {x:x,type:"ceilspike"};
return {x:x,type:"ceilblock"};
}





function makeGdObject(x){
const r=Math.random();
if(r<0.14){
const m=["cube","ship","ball"][Math.floor(Math.random()*3)];
genMode=m;
return {x:x,type:"portal",mode:m};
}
if(genMode=="ship")return makeShipObstacle(x);
if(genMode=="ball")return makeBallObstacle(x);
return makeCubeObstacle(x);
}





function startGeometry(){
gdObjects=[];
for(let i=0;i<8;i++){
gdObjects.push(makeGdObject(650+i*250));
}
gdPlayer.x=120;
gdPlayer.y=330;
gdPlayer.vy=0;
gdPlayer.onGround=true;
gdScore=0;
gdDead=false;
gdMode="cube";
gdGravity=1;
genMode="cube";
}





function jumpGD(){
if(gdDead){
startGeometry();
return;
}
if(gdMode=="cube"){
if(gdPlayer.onGround){
gdPlayer.vy=-13;
gdPlayer.onGround=false;
}
}else if(gdMode=="ball"){
gdGravity*=-1;
}
}





function updateCube(){
gdPlayer.vy+=0.7;
gdPlayer.y+=gdPlayer.vy;
if(gdPlayer.y>=330){
gdPlayer.y=330;
gdPlayer.vy=0;
gdPlayer.onGround=true;
}
}





function landOnBlock(o){
if(hOverlap(o)&&gdPlayer.y+35>=310&&gdPlayer.y+35<=340&&gdPlayer.vy>=0){
gdPlayer.y=275;
gdPlayer.vy=0;
gdPlayer.onGround=true;
}
}





function updateShip(){
if(keys["Space"])gdPlayer.vy-=0.9;
else gdPlayer.vy+=0.5;
gdPlayer.y+=gdPlayer.vy;
if(gdPlayer.y<10){gdPlayer.y=10;gdPlayer.vy=0;}
if(gdPlayer.y>330){gdPlayer.y=330;gdPlayer.vy=0;}
}





function updateBall(){
gdPlayer.vy+=0.7*gdGravity;
gdPlayer.y+=gdPlayer.vy;
if(gdGravity>0&&gdPlayer.y>330){
gdPlayer.y=330;
gdPlayer.vy=0;
}
if(gdGravity<0&&gdPlayer.y<0){
gdPlayer.y=0;
gdPlayer.vy=0;
}
}





function cubeCollide(o){
if(o.type=="spike"||o.type=="spikewall"){
if(hOverlap(o)&&gdPlayer.y+35>325)gdDead=true;
}else if(o.type=="tall"){
if(hOverlap(o)&&gdPlayer.y+35>280)gdDead=true;
}else if(o.type=="block"){
landOnBlock(o);
}
}





function shipCollide(o){
if(o.type=="spike"||o.type=="spikewall"){
if(hOverlap(o)&&gdPlayer.y+35>325)gdDead=true;
}else if(o.type=="tall"){
if(hOverlap(o)&&gdPlayer.y+35>280)gdDead=true;
}else if(o.type=="block"){
if(hOverlap(o)&&gdPlayer.y+35>310)gdDead=true;
}else if(o.type=="ceilspike"){
if(hOverlap(o)&&gdPlayer.y<45)gdDead=true;
}else if(o.type=="ceilblock"){
if(hOverlap(o)&&gdPlayer.y<60)gdDead=true;
}
}





function ballCollide(o){
if(o.type=="spike"||o.type=="spikewall"||o.type=="tall"||o.type=="block"){
if(hOverlap(o)&&gdPlayer.y+35>325)gdDead=true;
}else if(o.type=="ceilspike"){
if(hOverlap(o)&&gdPlayer.y<45)gdDead=true;
}else if(o.type=="ceilblock"){
if(hOverlap(o)&&gdPlayer.y<60)gdDead=true;
}
}





function updateGeometry(){
if(gdDead)return;
gdObjects.forEach(o=>o.x-=gdSpeed);
if(gdMode=="cube")updateCube();
else if(gdMode=="ship")updateShip();
else updateBall();
gdObjects.forEach(o=>{
if(o.type=="portal"){
if(!o.done&&o.x<gdPlayer.x+35&&gdPlayer.y+35>120&&gdPlayer.y<370){
o.done=true;
gdMode=o.mode;
gdPlayer.vy=0;
gdGravity=1;
gdPlayer.onGround=false;
}
}else if(gdMode=="cube"){
cubeCollide(o);
}else if(gdMode=="ship"){
shipCollide(o);
}else{
ballCollide(o);
}
});
if(gdObjects[0].x<0){
gdObjects.shift();
const lastX=gdObjects[gdObjects.length-1].x;
const nx=Math.min(1450,Math.max(950+Math.random()*250,lastX+130));
gdObjects.push(makeGdObject(nx));
gdScore++;
}
}





const gdStars=[];
for(let i=0;i<120;i++){
  gdStars.push({x:Math.random()*900,y:Math.random()*400,r:Math.random()*2+0.5,tw:Math.random()*Math.PI*2});
}
const gdPalette=["#ff5e7e","#ffb86b","#ffe66d","#7bdff2","#a78bfa","#5ef38c"];

function drawPortal(o){
  const col=o.mode=="ship"?"#00c3ff":o.mode=="ball"?"#ff8c00":"#66ff66";
  ctx.save();
  ctx.shadowColor=col;
  ctx.shadowBlur=18;
  ctx.fillStyle=col;
  ctx.fillRect(o.x+5,120,18,250);
  ctx.shadowBlur=0;
  ctx.fillStyle="rgba(255,255,255,.7)";
  ctx.fillRect(o.x+8,120,4,250);
  ctx.fillRect(o.x+16,120,4,250);
  ctx.fillStyle="rgba(0,0,0,.15)";
  ctx.fillRect(o.x+9,120,2,250);
  ctx.fillRect(o.x+17,120,2,250);
  ctx.restore();
}





function drawObstacle(o){
  ctx.save();
  if(o.type=="spike"){
    const g=ctx.createLinearGradient(o.x,370,o.x+17,325);
    g.addColorStop(0,"#ff5e7e");
    g.addColorStop(1,"#ffd6e0");
    ctx.fillStyle=g;
    ctx.shadowColor="#ff5e7e";
    ctx.shadowBlur=10;
    ctx.beginPath();
    ctx.moveTo(o.x,370);
    ctx.lineTo(o.x+35,370);
    ctx.lineTo(o.x+17,325);
    ctx.fill();
  }else if(o.type=="spikewall"){
    ctx.shadowColor="#ff5e7e";
    ctx.shadowBlur=8;
    for(let i=0;i<o.n;i++){
      const sx=o.x+i*35;
      const g=ctx.createLinearGradient(sx,370,sx+17,325);
      g.addColorStop(0,"#ff5e7e");
      g.addColorStop(1,"#ffd6e0");
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.moveTo(sx,370);
      ctx.lineTo(sx+35,370);
      ctx.lineTo(sx+17,325);
      ctx.fill();
    }
  }else if(o.type=="block"){
    const g=ctx.createLinearGradient(o.x,310,o.x+70,370);
    g.addColorStop(0,"#ffd84d");
    g.addColorStop(1,"#ff9f1c");
    ctx.fillStyle=g;
    ctx.shadowColor="#ffb84d";
    ctx.shadowBlur=12;
    ctx.fillRect(o.x,310,70,60);
    ctx.fillStyle="rgba(255,255,255,.25)";
    ctx.fillRect(o.x+4,310,8,60);
    ctx.fillRect(o.x+70-16,310,8,60);
  }else if(o.type=="tall"){
    const g=ctx.createLinearGradient(o.x,310,o.x+70,370);
    g.addColorStop(0,"#ffb84d");
    g.addColorStop(1,"#ff6b1c");
    ctx.fillStyle=g;
    ctx.shadowColor="#ffb84d";
    ctx.shadowBlur=12;
    ctx.fillRect(o.x,310,70,60);
    const g2=ctx.createLinearGradient(o.x,310,o.x+35,280);
    g2.addColorStop(0,"#ff6b9d");
    g2.addColorStop(1,"#ffd6e0");
    ctx.fillStyle=g2;
    ctx.beginPath();
    ctx.moveTo(o.x,310);
    ctx.lineTo(o.x+70,310);
    ctx.lineTo(o.x+35,280);
    ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.3)";
    ctx.fillRect(o.x+6,310,6,60);
  }else if(o.type=="ceilspike"){
    const g=ctx.createLinearGradient(o.x,0,o.x+17,45);
    g.addColorStop(0,"#7bdff2");
    g.addColorStop(1,"#e0fbff");
    ctx.fillStyle=g;
    ctx.shadowColor="#7bdff2";
    ctx.shadowBlur=10;
    ctx.beginPath();
    ctx.moveTo(o.x,0);
    ctx.lineTo(o.x+35,0);
    ctx.lineTo(o.x+17,45);
    ctx.fill();
  }else if(o.type=="ceilblock"){
    const g=ctx.createLinearGradient(o.x,0,o.x+70,60);
    g.addColorStop(0,"#a78bfa");
    g.addColorStop(1,"#5f3dc4");
    ctx.fillStyle=g;
    ctx.shadowColor="#a78bfa";
    ctx.shadowBlur=12;
    ctx.fillRect(o.x,0,70,60);
    ctx.fillStyle="rgba(255,255,255,.25)";
    ctx.fillRect(o.x+4,4,8,56);
    ctx.fillRect(o.x+70-16,4,8,56);
  }else if(o.type=="portal"){
    drawPortal(o);
  }
  ctx.restore();
}





function drawPlayerGeometry(){
  ctx.save();
  if(gdMode=="cube"){
    ctx.shadowColor="#00ffff";
    ctx.shadowBlur=14;
    const g=ctx.createLinearGradient(gdPlayer.x,gdPlayer.y,gdPlayer.x+35,gdPlayer.y+35);
    g.addColorStop(0,"#66ffff");
    g.addColorStop(1,"#0088ff");
    ctx.fillStyle=g;
    ctx.fillRect(gdPlayer.x,gdPlayer.y,35,35);
    ctx.shadowBlur=0;
    ctx.fillStyle="rgba(255,255,255,.55)";
    ctx.fillRect(gdPlayer.x+3,gdPlayer.y+3,29,5);
    ctx.fillStyle="#003355";
    ctx.fillRect(gdPlayer.x+5,gdPlayer.y+20,7,10);
    ctx.fillRect(gdPlayer.x+23,gdPlayer.y+20,7,10);
  }else if(gdMode=="ship"){
    ctx.shadowColor="#00ffcc";
    ctx.shadowBlur=14;
    const g=ctx.createLinearGradient(gdPlayer.x,gdPlayer.y+8,gdPlayer.x+35,gdPlayer.y+26);
    g.addColorStop(0,"#66ffcc");
    g.addColorStop(1,"#00aaff");
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(gdPlayer.x,gdPlayer.y+8);
    ctx.lineTo(gdPlayer.x+35,gdPlayer.y+17);
    ctx.lineTo(gdPlayer.x,gdPlayer.y+26);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle="rgba(255,255,255,.7)";
    ctx.fillRect(gdPlayer.x,gdPlayer.y+15,20,5);
    ctx.fillStyle="#00aa88";
    ctx.fillRect(gdPlayer.x+20,gdPlayer.y+20,5,10);
    ctx.fillStyle="#ffd84d";
    ctx.beginPath();
    ctx.arc(gdPlayer.x+4,gdPlayer.y+17,2.5,0,Math.PI*2);
    ctx.fill();
  }else if(gdMode=="ball"){
    ctx.shadowColor="#ff8c00";
    ctx.shadowBlur=14;
    const g=ctx.createRadialGradient(gdPlayer.x+10,gdPlayer.y+10,2,gdPlayer.x+17.5,gdPlayer.y+17.5,17.5);
    g.addColorStop(0,"#ffd0a0");
    g.addColorStop(1,"#ff6600");
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(gdPlayer.x+17.5,gdPlayer.y+17.5,17.5,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle="#7a3300";
    ctx.beginPath();
    ctx.arc(gdPlayer.x+12,gdPlayer.y+14,4,0,Math.PI*2);
    ctx.arc(gdPlayer.x+24,gdPlayer.y+20,4,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.5)";
    ctx.beginPath();
    ctx.arc(gdPlayer.x+10,gdPlayer.y+9,5,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}





function drawGeometry(){
  const t=performance.now()/1000;
  let bg=ctx.createLinearGradient(0,0,0,500);
  bg.addColorStop(0,"#1a0b3e");
  bg.addColorStop(0.55,"#3b1d6e");
  bg.addColorStop(1,"#12081f");
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,900,500);
  const gdX=-(gdObjects[0]?gdObjects[0].x:900);
  gdStars.forEach((s,i)=>{
    const tw=0.5+0.5*Math.sin(t*2+s.tw);
    const hue=(s.x*1.3+i)%360;
    ctx.globalAlpha=tw*0.8;
    ctx.fillStyle="hsl("+hue+",90%,75%)";
    ctx.fillRect(((s.x-gdX*0.1)%900+900)%900,s.y,s.r*2,s.r*2);
  });
  ctx.globalAlpha=1;
  ctx.fillStyle="#00ffff";
  ctx.shadowColor="#00ffff";
  ctx.shadowBlur=12;
  ctx.fillRect(0,370,900,130);
  ctx.shadowBlur=0;
  ctx.fillStyle="rgba(255,255,255,.25)";
  ctx.fillRect(0,370,900,4);
  ctx.fillStyle="#1a0b3e";
  for(let i=0;i<30;i++){
    ctx.fillRect((i*30)%900,372,14,6);
  }
  const hue=(t*40)%360;
  ctx.fillStyle="hsl("+hue+",100%,60%)";
  ctx.shadowColor=ctx.fillStyle;
  ctx.shadowBlur=8;
  ctx.font="25px Arial";
  ctx.fillText("Score: "+gdScore+"   Mode: "+gdMode,20,40);
  ctx.shadowBlur=0;
  ctx.fillStyle="hsl("+((hue+40)%360)+",100%,70%)";

function startSoccer(){
soccer.player={x:250,y:250,speed:4,face:1,hasBall:true,cooldown:0};
soccer.ball={x:250,y:250,vx:0,vy:0};
soccer.defenders=[{x:170,y:170},{x:170,y:330}];
soccer.enemyDefenders=[{x:520,y:170},{x:520,y:330}];
soccer.attackers=[{x:600,y:200},{x:650,y:300}];
soccer.goalie={x:130,y:250};
soccer.enemyGoalie={x:670,y:250};
soccer.score={you:0,enemy:0};
}



function soccerShoot(){
const p=soccer.player;
if(p.hasBall&&p.cooldown<=0){
p.hasBall=false;
soccer.ball.x=p.x+p.face*35;
soccer.ball.y=p.y;
soccer.ball.vx=p.face*18;
soccer.ball.vy=0;
p.cooldown=40;
}
}



function soccerMoveTo(a,b,s){
if(a.x<b.x)a.x+=s;
if(a.x>b.x)a.x-=s;
if(a.y<b.y)a.y+=s;
if(a.y>b.y)a.y-=s;
}



function soccerReset(){
const p=soccer.player,b=soccer.ball;
p.x=250;p.y=250;p.hasBall=true;
b.x=250;b.y=250;b.vx=0;b.vy=0;
}



function soccerUpdate(){
const p=soccer.player,b=soccer.ball;
if(p.cooldown>0)p.cooldown--;
if(keys["KeyW"])p.y-=p.speed;
if(keys["KeyS"])p.y+=p.speed;
if(keys["KeyA"]){p.x-=p.speed;p.face=-1;}
if(keys["KeyD"]){p.x+=p.speed;p.face=1;}
if(p.hasBall){
b.x=p.x+p.face*25;
b.y=p.y;
}else{
b.x+=b.vx;
b.y+=b.vy;
b.vx*=0.98;
b.vy*=0.98;
if(Math.hypot(b.x-p.x,b.y-p.y)<35&&p.cooldown<=0){
p.hasBall=true;
b.vx=0;
b.vy=0;
}
}
soccer.defenders.forEach(d=>{if(b.x<450)soccerMoveTo(d,b,1);});
soccer.enemyDefenders.forEach(d=>{if(b.x>450)soccerMoveTo(d,b,1);});
soccer.attackers.forEach(a=>{
if(p.hasBall)soccerMoveTo(a,p,1);
if(Math.hypot(a.x-p.x,a.y-p.y)<35&&p.hasBall){
p.hasBall=false;
b.vx=-7;
}
});
soccer.goalie.y+=(b.y-soccer.goalie.y)*0.08;
soccer.enemyGoalie.y+=(b.y-soccer.enemyGoalie.y)*0.08;
soccer.goalie.y=Math.max(170,Math.min(330,soccer.goalie.y));
soccer.enemyGoalie.y=Math.max(170,Math.min(330,soccer.enemyGoalie.y));
if(b.x<170&&Math.abs(b.y-soccer.goalie.y)<45){
b.x=170;
b.vx=10;
}
if(b.x>630&&Math.abs(b.y-soccer.enemyGoalie.y)<45){
b.x=630;
b.vx=-10;
}
if(b.x<0||b.x>900||b.y<0||b.y>500)soccerReset();
if(b.x>700&&b.y>150&&b.y<350){soccer.score.you++;soccerReset();}
if(b.x<120&&b.y>150&&b.y<350){soccer.score.enemy++;soccerReset();}
}

let arrow={

let arrowWalls=[];

function makeArrowObstacle(x){
const r=Math.random();
if(r<0.34){
const gapH=140+Math.random()*80;
const gapTop=40+Math.random()*(400-gapH);
return {x:x,type:"gate",gapTop:gapTop,gapBot:gapTop+gapH};
}
if(r<0.54)return {x:x,type:"floorspike",n:1+Math.floor(Math.random()*3)};
if(r<0.74)return {x:x,type:"ceilspike",n:1+Math.floor(Math.random()*3)};
if(r<0.88)return {x:x,type:"floorwall",h:110+Math.random()*120};
return {x:x,type:"ceilwall",h:110+Math.random()*120};
}

function startArrow(){
arrow.x=150;
arrow.y=220;
arrow.vy=0;
arrow.tilt=0;
arrow.dead=false;
arrow.deadT=0;
arrow.score=0;
arrow.speed=5;
arrowWalls=[];
for(let i=0;i<6;i++){
arrowWalls.push(makeArrowObstacle(700+i*280));
}
}

function jumpArrow(){
if(arrow.dead){
startArrow();
return;
}
}

function arrowHit(o){
const ax=arrow.x+4,ay=arrow.y+6,aw=22,ah=24;
if(o.type=="gate"){
return ax<o.x+70&&ax+aw>o.x&&(ay<o.gapTop||ay+ah>o.gapBot);
}
if(o.type=="floorspike"){
const w=o.n*40;
return ax<o.x+w&&ax+aw>o.x&&ay+ah>450;
}
if(o.type=="ceilspike"){
const w=o.n*40;
return ax<o.x+w&&ax+aw>o.x&&ay<50;
}
if(o.type=="floorwall"){
return ax<o.x+45&&ax+aw>o.x&&ay+ah>490-o.h;
}
if(o.type=="ceilwall"){
return ax<o.x+45&&ax+aw>o.x&&ay<o.h;
}
return false;
}

function updateArrow(){
if(arrow.dead){
arrow.deadT+=1/60;
if(arrow.deadT>0.6)startArrow();
return;
}
const up=arrowHeld||keys["Space"]||keys["KeyW"]||keys["ArrowUp"];
const targetV=up?-6:6;
arrow.vy+=(targetV-arrow.vy)*0.12;
arrow.y+=arrow.vy;
arrow.y=Math.max(0,Math.min(490-32,arrow.y));
const targTilt=Math.max(-0.85,Math.min(0.85,arrow.vy*0.14));
arrow.tilt+=(targTilt-arrow.tilt)*0.3;
arrowWalls.forEach(o=>o.x-=arrow.speed);
if(arrowWalls.length&&arrowWalls[0].x<-90){
arrowWalls.shift();
const last=arrowWalls[arrowWalls.length-1].x;
arrowWalls.push(makeArrowObstacle(Math.max(1200,last+260+Math.random()*120)));
arrow.score++;
}
arrow.speed=5+Math.floor(arrow.score/12);
for(const o of arrowWalls){
if(arrowHit(o)){arrow.dead=true;arrow.deadT=0;break;}
}
}

const MEM_LEVELS=[
{rows:3,cols:4},
{rows:4,cols:4},
{rows:4,cols:5},
{rows:4,cols:6},
{rows:5,cols:6}
];

const MEM_SYMBOLS=["🍎","🍌","🍇","🍓","🍒","🍑","🍍","🥝","🍋","🍉","🥭","🍊","🍐","🍈","🍅"];

let memory={level:0,moves:0,flips:[],matched:0,lock:false,timer:0,done:false};
let memGrid=[];

function loadMemoryLevel(){
const cfg=MEM_LEVELS[memory.level];
const n=cfg.rows*cfg.cols;
const pairs=n/2;
memGrid=[];
for(let i=0;i<pairs;i++){
memGrid.push({s:MEM_SYMBOLS[i],flip:false,matched:false});
memGrid.push({s:MEM_SYMBOLS[i],flip:false,matched:false});
}
for(let i=memGrid.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
const tmp=memGrid[i];
memGrid[i]=memGrid[j];
memGrid[j]=tmp;
}
memory.moves=0;
memory.flips=[];
memory.matched=0;
memory.lock=false;
memory.timer=0;
memory.done=false;
}

function startMemory(){
memory.level=0;
loadMemoryLevel();
}

function memCellFromClick(x,y){
const cfg=MEM_LEVELS[memory.level];
const padX=55,padY=90,gap=8;
const cw=(900-padX*2-gap*(cfg.cols-1))/cfg.cols;
const ch=(500-padY*2-gap*(cfg.rows-1))/cfg.rows;
const col=Math.floor((x-padX)/(cw+gap));
const row=Math.floor((y-padY)/(ch+gap));
if(col<0||col>=cfg.cols||row<0||row>=cfg.rows)return -1;
return row*cfg.cols+col;
}

function memNextLevel(){
if(memory.level>=MEM_LEVELS.length-1){
memory.level=0;
}else{
memory.level++;
}
loadMemoryLevel();
}

function memoryClick(x,y){
if(memory.done){
memNextLevel();
return;
}
if(memory.lock)return;
const idx=memCellFromClick(x,y);
if(idx<0)return;
const c=memGrid[idx];
if(c.flip||c.matched)return;
c.flip=true;
memory.moves++;
memory.flips.push(idx);
if(memory.flips.length===2){
memory.lock=true;
const a=memGrid[memory.flips[0]],b=memGrid[memory.flips[1]];
if(a.s===b.s){
a.matched=true;
b.matched=true;
memory.matched+=2;
memory.flips=[];
memory.lock=false;
if(memory.matched===memGrid.length)memory.done=true;
}else{
memory.timer=Date.now()+700;
}
}
}

canvas.addEventListener("mousedown",function(e){
if(mode!="memory")return;
const rect=canvas.getBoundingClientRect();
memoryClick(e.clientX-rect.left,e.clientY-rect.top);
});

function updateMemory(){
if(memory.lock&&memory.timer&&Date.now()>memory.timer){
memGrid[memory.flips[0]].flip=false;
memGrid[memory.flips[1]].flip=false;
memory.flips=[];
memory.lock=false;
memory.timer=0;
}
}

function memCardPath(cx,cy,w,h){
ctx.beginPath();
if(ctx.roundRect){
ctx.roundRect(cx,cy,w,h,10);
}else{
ctx.rect(cx,cy,w,h);
}
}

const cfg=MEM_LEVELS[memory.level];
let bg=ctx.createLinearGradient(0,0,0,500);

for(let r=0;r<cfg.rows;r++){

// MATCH-3
// =============================

const M3_COLS=8;
const M3_ROWS=8;
const M3_SIZE=56;
const M3_X=Math.floor((900-M3_COLS*M3_SIZE)/2);
const M3_Y=26;
const M3_EMOJI=["🍎","🍊","🍏","🍇","🍓","🍌"];
const M3_COLORS=["#ff5252","#ffa000","#66bb6a","#ab47bc","#ff5e7e","#fdd835"];

let m3={
  board:[],
  off:[],
  score:0,
  target:500,
  level:1,
  moves:0,
  combos:0,
  selected:null,
  animating:false,
  levelUpTimer:0,
  queue:[]
};
let m3SwapBack=null;

function m3NewGem(){
  return Math.floor(Math.random()*M3_EMOJI.length);
}

function m3InitBoard(){
  m3.board=[];
  m3.off=[];
  for(let r=0;r<M3_ROWS;r++){
    m3.board.push([]);
    m3.off.push([]);
    for(let c=0;c<M3_COLS;c++){
      m3.board[r].push(m3NewGem());
      m3.off[r].push(0);
    }
  }
  let matches=m3FindMatches();
  while(matches.length){
    matches.forEach(([r,c])=>m3.board[r][c]=-1);
    m3Gravity();
    m3.animating=false;
    for(let r=0;r<M3_ROWS;r++)for(let c=0;c<M3_COLS;c++)m3.off[r][c]=0;
    matches=m3FindMatches();
  }
}

function startMatch3(){
  m3.score=0;
  m3.target=500;
  m3.level=1;
  m3.moves=0;
  m3.combos=0;
  m3.selected=null;
  m3.animating=false;
  m3.levelUpTimer=0;
  m3SwapBack=null;
  m3.queue=[];
  m3InitBoard();
}

function m3FindMatches(){
  const matched={};
  for(let r=0;r<M3_ROWS;r++){
    for(let c=0;c<M3_COLS-2;c++){
      const t=m3.board[r][c];
      if(t<0)continue;
      let len=1;
      while(c+len<M3_COLS&&m3.board[r][c+len]===t)len++;
      if(len>=3)for(let k=0;k<len;k++)matched[r+","+(c+k)]=true;
      c+=len-1;
    }
  }
  for(let c=0;c<M3_COLS;c++){
    for(let r=0;r<M3_ROWS-2;r++){
      const t=m3.board[r][c];
      if(t<0)continue;
      let len=1;
      while(r+len<M3_ROWS&&m3.board[r+len][c]===t)len++;
      if(len>=3)for(let k=0;k<len;k++)matched[(r+k)+","+c]=true;
      r+=len-1;
    }
  }
  return Object.keys(matched).map(k=>k.split(",").map(Number));
}

function m3RemoveMatches(list){
  list.forEach(([r,c])=>m3.board[r][c]=-1);
  m3.score+=list.length*10*m3.combos;
}

function m3Gravity(){
  for(let c=0;c<M3_COLS;c++){
    let write=M3_ROWS-1;
    for(let r=M3_ROWS-1;r>=0;r--){
      if(m3.board[r][c]>=0){
        if(write!==r){
          m3.board[write][c]=m3.board[r][c];
          m3.board[r][c]=-1;
          m3.off[write][c]=(write-r)*M3_SIZE;
        }
        write--;
      }
    }
    for(let r=write;r>=0;r--){
      m3.board[r][c]=m3NewGem();
      m3.off[r][c]=(write+1)*M3_SIZE;
    }
  }
}

function m3Swap(r1,c1,r2,c2){
  const t=m3.board[r1][c1];
  m3.board[r1][c1]=m3.board[r2][c2];
  m3.board[r2][c2]=t;
  const matches=m3FindMatches();
  if(matches.length){
    m3.moves++;
    m3.combos=1;
    m3RemoveMatches(matches);
    m3Gravity();
    m3.animating=true;
  }else{
    const t2=m3.board[r1][c1];
    m3.board[r1][c1]=m3.board[r2][c2];
    m3.board[r2][c2]=t2;
    m3SwapBack={r1:r1,c1:c1,r2:r2,c2:c2,t:0};
  }
}

function m3CellFromClick(x,y){
  const c=Math.floor((x-M3_X)/M3_SIZE);
  const r=Math.floor((y-M3_Y)/M3_SIZE);
  if(c<0||c>=M3_COLS||r<0||r>=M3_ROWS)return -1;
  return r*M3_COLS+c;
}

function m3Click(x,y){
  if(m3.animating||m3SwapBack||m3.levelUpTimer>0){
    m3.queue.push({x:x,y:y});
    return;
  }
  const idx=m3CellFromClick(x,y);
  if(idx<0)return;
  const r=Math.floor(idx/M3_COLS),c=idx%M3_COLS;
  if(m3.selected===null){
    m3.selected={r:r,c:c};
    return;
  }
  const s=m3.selected;
  if(s.r===r&&s.c===c){
    m3.selected=null;
    return;
  }
  if(Math.abs(s.r-r)+Math.abs(s.c-c)===1){
    m3Swap(s.r,s.c,r,c);
    m3.selected=null;
  }else{
    m3.selected={r:r,c:c};
  }
}

function m3DrainQueue(){
  while(m3.queue.length&&!m3.animating&&!m3SwapBack&&m3.levelUpTimer<=0){
    const e=m3.queue.shift();
    m3Click(e.x,e.y);
  }
}

function updateMatch3(){
  if(m3SwapBack){
    m3SwapBack.t+=0.08;
    if(m3SwapBack.t>=1)m3SwapBack=null;
  }
  if(m3.levelUpTimer>0)m3.levelUpTimer-=1/60;
  if(m3.animating){
    let done=true;
    for(let r=0;r<M3_ROWS;r++)for(let c=0;c<M3_COLS;c++){
      if(m3.off[r][c]!==0){
        m3.off[r][c]-=m3.off[r][c]*0.3;
        if(Math.abs(m3.off[r][c])<0.5)m3.off[r][c]=0;
        else done=false;
      }
    }
    if(done){
      m3.animating=false;
      const matches=m3FindMatches();
      if(matches.length){
        m3.combos++;
        m3RemoveMatches(matches);
        m3Gravity();
        m3.animating=true;
      }else{
        m3.combos=0;
        if(m3.score>=m3.target){
          m3.level++;
          m3.target=m3.level*500;
          m3.levelUpTimer=1.5;
        }
      }
    }
  }
  m3DrainQueue();
}

function m3DrawGem(x,y,type,scale){
  ctx.save();
  ctx.translate(x,y);
  const r=24*scale;
  ctx.shadowColor=M3_COLORS[type];
  ctx.shadowBlur=12;
  const g=ctx.createRadialGradient(-5,-5,2,0,0,r);
  g.addColorStop(0,"#fff");
  g.addColorStop(0.35,M3_COLORS[type]);
  g.addColorStop(1,"#333");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.font=Math.round(26*scale)+"px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(M3_EMOJI[type],0,2);
  ctx.textAlign="left";
  ctx.textBaseline="alphabetic";
  ctx.restore();
}

function drawMatch3(){
  const t=performance.now()/1000;
  let bg=ctx.createLinearGradient(0,0,0,500);
  bg.addColorStop(0,"#0b1a3e");
  bg.addColorStop(0.5,"#2b1d5e");
  bg.addColorStop(1,"#0f0a20");
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,900,500);
  for(let i=0;i<50;i++){
    const tw=0.4+0.4*Math.sin(t*2+i*1.7);
    ctx.globalAlpha=tw;
    ctx.fillStyle="#fff";
    ctx.fillRect((i*137)%900,(i*97)%400,2,2);
  }
  ctx.globalAlpha=1;
  ctx.fillStyle="rgba(255,255,255,.06)";
  ctx.fillRect(M3_X-6,M3_Y-6,M3_COLS*M3_SIZE+12,M3_ROWS*M3_SIZE+12);
  ctx.strokeStyle="#7bdff2";
  ctx.lineWidth=2;
  ctx.strokeRect(M3_X-6,M3_Y-6,M3_COLS*M3_SIZE+12,M3_ROWS*M3_SIZE+12);
  for(let r=0;r<M3_ROWS;r++)for(let c=0;c<M3_COLS;c++){
    const type=m3.board[r][c];
    if(type<0)continue;
    let x=M3_X+c*M3_SIZE+M3_SIZE/2;
    let y=M3_Y+r*M3_SIZE+M3_SIZE/2+m3.off[r][c];
    if(m3SwapBack){
      const sb=m3SwapBack;
      const f=Math.sin(Math.PI*Math.min(1,sb.t));
      if(sb.r1===r&&sb.c1===c){
        x+=(sb.c2-sb.c1)*M3_SIZE*f;
        y+=(sb.r2-sb.r1)*M3_SIZE*f;
      }else if(sb.r2===r&&sb.c2===c){
        x+=(sb.c1-sb.c2)*M3_SIZE*f;
        y+=(sb.r1-sb.r2)*M3_SIZE*f;
      }
    }
    m3DrawGem(x,y,type,1);
  }
  if(m3.selected){
    const s=m3.selected;
    ctx.strokeStyle="#fff";
    ctx.lineWidth=3;
    ctx.shadowColor="#fff";
    ctx.shadowBlur=10;
    ctx.strokeRect(M3_X+s.c*M3_SIZE+2,M3_Y+s.r*M3_SIZE+2,M3_SIZE-4,M3_SIZE-4);
    ctx.shadowBlur=0;
  }
  const hue=(t*40)%360;
  ctx.fillStyle="#fff";
  ctx.shadowColor="hsl("+hue+",100%,60%)";
  ctx.shadowBlur=8;
  ctx.font="bold 24px Arial";
  ctx.fillText("💎 MATCH-3",20,40);
  ctx.shadowBlur=0;
  ctx.fillStyle="#ffd84d";
  ctx.font="18px Arial";
  ctx.fillText("Score: "+m3.score,20,70);
  ctx.fillStyle="#7bdff2";
  ctx.fillText("Level "+m3.level+"   Target: "+m3.target+"   Moves: "+m3.moves,20,95);
  ctx.fillStyle="rgba(255,255,255,.6)";
  ctx.font="15px Arial";
  ctx.fillText("Click a gem, then click a neighbor to swap",20,120);
  if(m3.levelUpTimer>0){
    ctx.fillStyle="rgba(0,0,0,.55)";
    ctx.fillRect(0,0,900,500);
    ctx.fillStyle="#ffe66d";
    ctx.shadowColor="#ffe66d";
    ctx.shadowBlur=16;
    ctx.font="bold 42px Arial";
    ctx.textAlign="center";
    ctx.fillText("LEVEL "+m3.level+"!",450,220);
    ctx.shadowBlur=0;
    ctx.fillStyle="#fff";
    ctx.font="22px Arial";
    ctx.fillText("New target: "+m3.target+" points",450,260);
    ctx.textAlign="left";
  }
}

canvas.addEventListener("mousedown",function(e){
  if(mode!="match3")return;
  const rect=canvas.getBoundingClientRect();
  m3Click(e.clientX-rect.left,e.clientY-rect.top);
});

const PZ_N=4;
const PZ_SIZE=120;
const PZ_X=Math.floor((900-PZ_N*PZ_SIZE)/2);
const PZ_Y=25;

let pz={board:[],moves:0,time:0,done:false};
let pzImg=document.createElement("canvas");
pzImg.width=PZ_N*PZ_SIZE;
pzImg.height=PZ_N*PZ_SIZE;

function buildPuzzleImage(){
  const c=pzImg.getContext("2d");
  const W=PZ_N*PZ_SIZE,H=PZ_N*PZ_SIZE;
  let g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#4fc3f7");
  g.addColorStop(1,"#e1f5fe");
  c.fillStyle=g;
  c.fillRect(0,0,W,H);
  c.fillStyle="#ffd54f";
  c.beginPath();
  c.arc(W*0.82,H*0.18,W*0.10,0,Math.PI*2);
  c.fill();
  c.strokeStyle="#ffe082";
  c.lineWidth=8;
  for(let i=0;i<12;i++){
    const a=i/12*Math.PI*2;
    c.beginPath();
    c.moveTo(W*0.82+Math.cos(a)*W*0.11,H*0.18+Math.sin(a)*W*0.11);
    c.lineTo(W*0.82+Math.cos(a)*W*0.16,H*0.18+Math.sin(a)*W*0.16);
    c.stroke();
  }
  c.fillStyle="rgba(255,255,255,.9)";
  c.beginPath();
  c.arc(W*0.25,H*0.18,W*0.09,0,Math.PI*2);
  c.arc(W*0.34,H*0.16,W*0.11,0,Math.PI*2);
  c.arc(W*0.42,H*0.19,W*0.08,0,Math.PI*2);
  c.fill();
  c.fillStyle="rgba(255,255,255,.7)";
  c.beginPath();
  c.arc(W*0.65,H*0.30,W*0.07,0,Math.PI*2);
  c.arc(W*0.72,H*0.28,W*0.09,0,Math.PI*2);
  c.fill();
  c.fillStyle="#90a4ae";
  c.beginPath();
  c.moveTo(0,H*0.55);
  c.lineTo(W*0.22,H*0.30);
  c.lineTo(W*0.38,H*0.55);
  c.closePath();
  c.fill();
  c.fillStyle="#b0bec5";
  c.beginPath();
  c.moveTo(W*0.30,H*0.55);
  c.lineTo(W*0.55,H*0.25);
  c.lineTo(W*0.80,H*0.55);
  c.closePath();
  c.fill();
  c.fillStyle="#8d6e63";
  c.beginPath();
  c.moveTo(W*0.60,H*0.60);
  c.lineTo(W*0.85,H*0.35);
  c.lineTo(W*1.0,H*0.52);
  c.lineTo(W,H*0.60);
  c.closePath();
  c.fill();
  c.fillStyle="#fff";
  c.beginPath();
  c.moveTo(W*0.45,H*0.36);
  c.lineTo(W*0.55,H*0.25);
  c.lineTo(W*0.65,H*0.36);
  c.lineTo(W*0.55,H*0.42);
  c.closePath();
  c.fill();
  c.fillStyle="#66bb6a";
  c.fillRect(0,H*0.55,W,H*0.45);
  c.fillStyle="#81c784";
  for(let i=0;i<90;i++){
    const x=Math.random()*W,y=H*0.55+Math.random()*H*0.45;
    c.fillRect(x,y,3,2);
  }
  c.fillStyle="#e1f5fe";
  c.beginPath();
  c.moveTo(W*0.45,H*0.72);
  c.bezierCurveTo(W*0.30,H*0.62,W*0.18,H*0.70,W*0.05,H*0.66);
  c.lineTo(W*0.05,H*0.95);
  c.bezierCurveTo(W*0.22,H*0.98,W*0.42,H*0.95,W*0.55,H*0.78);
  c.closePath();
  c.fill();
  c.strokeStyle="#90caf9";
  c.lineWidth=3;
  for(let i=0;i<5;i++){
    const y=H*0.72+i*0.045*H;
    c.beginPath();
    c.moveTo(W*0.12,y);
    c.quadraticCurveTo(W*0.25,y+0.02*H,W*0.38,y);
    c.stroke();
  }
  c.fillStyle="#5d4037";
  c.fillRect(W*0.72,H*0.45,W*0.05,H*0.22);
  c.fillStyle="#2e7d32";
  c.beginPath();
  c.arc(W*0.745,H*0.42,W*0.10,0,Math.PI*2);
  c.fill();
  c.fillStyle="#388e3c";
  c.beginPath();
  c.arc(W*0.70,H*0.46,W*0.08,0,Math.PI*2);
  c.arc(W*0.79,H*0.44,W*0.09,0,Math.PI*2);
  c.fill();
  c.fillStyle="#ff7043";
  for(let i=0;i<12;i++){
    const x=0.1*W+Math.random()*0.5*W,y=H*0.60+Math.random()*0.25*H;
    c.beginPath();
    c.arc(x,y,4,0,Math.PI*2);
    c.fill();
  }
  c.fillStyle="#f6d365";
  for(let i=0;i<8;i++){
    const x=0.55*W+Math.random()*0.4*W,y=H*0.62+Math.random()*0.2*H;
    c.beginPath();
    c.arc(x,y,3.5,0,Math.PI*2);
    c.fill();
  }
}

function startPuzzle(){
  buildPuzzleImage();
  pz.board=[];
  for(let i=0;i<PZ_N*PZ_N;i++)pz.board.push(i);
  for(let i=0;i<250;i++){
    const blank=pz.board.indexOf(0);
    const r=Math.floor(blank/PZ_N),c=blank%PZ_N;
    const moves=[];
    if(r>0)moves.push(blank-PZ_N);
    if(r<PZ_N-1)moves.push(blank+PZ_N);
    if(c>0)moves.push(blank-1);
    if(c<PZ_N-1)moves.push(blank+1);
    const n=moves[Math.floor(Math.random()*moves.length)];
    pz.board[blank]=pz.board[n];
    pz.board[n]=0;
  }
  pz.moves=0;
  pz.time=0;
  pz.done=false;
}

function puzzleClick(x,y){
  if(pz.done){
    startPuzzle();
    return;
  }
  const c=Math.floor((x-PZ_X)/PZ_SIZE);
  const r=Math.floor((y-PZ_Y)/PZ_SIZE);
  if(c<0||c>=PZ_N||r<0||r>=PZ_N)return;
  const idx=r*PZ_N+c;
  const blank=pz.board.indexOf(0);
  const br=Math.floor(blank/PZ_N),bc=blank%PZ_N;
  if(Math.abs(br-r)+Math.abs(bc-c)===1){
    pz.board[blank]=pz.board[idx];
    pz.board[idx]=0;
    pz.moves++;
    if(pz.board.every((t,i)=>t===i))pz.done=true;
  }
}

canvas.addEventListener("mousedown",function(e){
  if(mode!="puzzle")return;
  const rect=canvas.getBoundingClientRect();
  puzzleClick(e.clientX-rect.left,e.clientY-rect.top);
});

function updatePuzzle(){
  if(!pz.done)pz.time+=1/60;
}

function drawPuzzle(){
  const t=performance.now()/1000;
  let bg=ctx.createLinearGradient(0,0,0,500);
  bg.addColorStop(0,"#0b1a3e");
  bg.addColorStop(0.5,"#2b1d5e");

  ctx.fillStyle=bg;
  ctx.fillRect(0,0,900,500);
  ctx.fillStyle="rgba(255,255,255,.06)";
  ctx.fillRect(PZ_X-6,PZ_Y-6,PZ_N*PZ_SIZE+12,PZ_N*PZ_SIZE+12);
  ctx.strokeStyle="#7bdff2";
  ctx.lineWidth=2;
  ctx.strokeRect(PZ_X-6,PZ_Y-6,PZ_N*PZ_SIZE+12,PZ_N*PZ_SIZE+12);
  for(let i=0;i<pz.board.length;i++){
    const tile=pz.board[i];
    if(tile===0)continue;
    const r=Math.floor(i/PZ_N),c=i%PZ_N;
    const sr=Math.floor(tile/PZ_N),sc=tile%PZ_N;
    ctx.drawImage(pzImg,sc*PZ_SIZE,sr*PZ_SIZE,PZ_SIZE,PZ_SIZE,PZ_X+c*PZ_SIZE,PZ_Y+r*PZ_SIZE,PZ_SIZE,PZ_SIZE);
    ctx.strokeStyle="rgba(0,0,0,.4)";
    ctx.lineWidth=2;
    ctx.strokeRect(PZ_X+c*PZ_SIZE,PZ_Y+r*PZ_SIZE,PZ_SIZE,PZ_SIZE);
  }
  const hue=(t*40)%360;
  ctx.fillStyle="#fff";
  ctx.shadowColor="hsl("+hue+",100%,60%)";
  ctx.shadowBlur=8;
  ctx.font="bold 24px Arial";
  ctx.fillText("🧩 PICTURE PUZZLE",20,40);
  ctx.shadowBlur=0;
  ctx.fillStyle="#ffd84d";
  ctx.font="18px Arial";
  const mm=Math.floor(pz.time/60),ss=Math.floor(pz.time%60);
  ctx.fillText("Moves: "+pz.moves+"   Time: "+mm+":"+(ss<10?"0":"")+ss,20,70);
  ctx.fillStyle="rgba(255,255,255,.6)";
  ctx.font="15px Arial";
  ctx.fillText("Click a tile next to the blank to slide it",20,95);
  if(pz.done){
    ctx.fillStyle="rgba(0,0,0,.55)";
    ctx.fillRect(0,0,900,500);
    ctx.fillStyle="#5ef38c";
    ctx.shadowColor="#5ef38c";
    ctx.shadowBlur=16;
    ctx.font="bold 42px Arial";
    ctx.textAlign="center";
    ctx.fillText("🎉 YOU WIN!",450,220);
    ctx.shadowBlur=0;
    ctx.fillStyle="#fff";
    ctx.font="24px Arial";
    ctx.fillText("CLICK TO PLAY AGAIN",450,270);
    ctx.textAlign="left";
  }
}

    {x:Math.floor(S3_C/2),y:Math.floor(S3_R/2)},
    {x:Math.floor(S3_C/2)-1,y:Math.floor(S3_R/2)},
    {x:Math.floor(S3_C/2)-2,y:Math.floor(S3_R/2)}
  ];
  snake3.dir={x:1,y:0};
  snake3.nextDir={x:1,y:0};
  snake3.score=0;
  snake3.dead=false;
  snake3.tick=0;
  snake3.speed=0.16;
  snake3.time=0;
  s3SpawnFood();
}

function s3SpawnFood(){
  let x,y,ok;
  do{
    x=Math.floor(Math.random()*S3_C);
    y=Math.floor(Math.random()*S3_R);
    ok=!snake3.body.some(b=>b.x===x&&b.y===y);
  }while(!ok);
  snake3.food={x:x,y:y};
}

function startSnake3(){
  s3Reset();
}

function s3Turn(){
  const nd=snake3.nextDir;
  if(nd.x===-snake3.dir.x&&nd.y===-snake3.dir.y)return;
  if(nd.x===snake3.dir.x&&nd.y===snake3.dir.y)return;
  snake3.dir={x:nd.x,y:nd.y};
}

function updateSnake3(){
  const t=performance.now()/1000;
  const head=snake3.body[0];
  const hx=S3_X0+head.x*S3_CELL+S3_CELL/2;
  const hz=S3_Z0+head.y*S3_CELL+S3_CELL/2;
  const hp=s3Proj(hx,15,hz);
  const outOfSight=hp.x<70||hp.x>830||hp.y<55||hp.y>445;
  const baseA=0.6;
  const targetA=outOfSight?Math.atan2(-hx,hz):baseA;
  let diff=targetA-s3Cam.a;
  diff=Math.atan2(Math.sin(diff),Math.cos(diff));
  s3Cam.a+=diff*0.05;
  if(snake3.dead)return;
  if(keys["ArrowUp"]||keys["KeyW"])snake3.nextDir={x:0,y:-1};
  else if(keys["ArrowDown"]||keys["KeyS"])snake3.nextDir={x:0,y:1};
  else if(keys["ArrowLeft"]||keys["KeyA"])snake3.nextDir={x:-1,y:0};
  else if(keys["ArrowRight"]||keys["KeyD"])snake3.nextDir={x:1,y:0};
  snake3.tick+=1/60;
  if(snake3.tick>=snake3.speed){
    snake3.tick=0;
    s3Turn();
    const head=snake3.body[0];
    const nx=head.x+snake3.dir.x;
    const ny=head.y+snake3.dir.y;
    if(nx<0||nx>=S3_C||ny<0||ny>=S3_R){
      snake3.dead=true;
      return;
    }
    if(snake3.body.some(b=>b.x===nx&&b.y===ny)){
      snake3.dead=true;
      return;
    }
    snake3.body.unshift({x:nx,y:ny});
    if(nx===snake3.food.x&&ny===snake3.food.y){
      snake3.score++;
      snake3.speed=Math.max(0.09,0.16-snake3.score*0.004);
      s3SpawnFood();
    }else{
      snake3.body.pop();
    }
  }
}

function s3Rot(px,py,pz){
  const a=s3Cam.a,e=s3Cam.e;
  const ca=Math.cos(a),sa=Math.sin(a),ce=Math.cos(e),se=Math.sin(e);
  const x1=px*ca+pz*sa;
  const z1=-px*sa+pz*ca;
  const y2=py*ce-z1*se;
  const z2=py*se+z1*ce;
  return {x:x1,y:y2,z:z2};
}

function s3Proj(px,py,pz){
  const r=s3Rot(px,py,pz);
  const s=s3Cam.focal/(s3Cam.dist-r.z);
  return {x:450+r.x*s,y:250-r.y*s,z:r.z,s:s};
}

function s3Fill(pts,color){
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.closePath();
  ctx.fillStyle=color;
  ctx.fill();
}

function s3Block(x0,z0,w,d,h,colors,yoff){
  const o=yoff||0;
  const pts=[
    s3Proj(x0,o,z0),
    s3Proj(x0+w,o,z0),
    s3Proj(x0+w,o,z0+d),
    s3Proj(x0,o,z0+d),
    s3Proj(x0,o+h,z0),
    s3Proj(x0+w,o+h,z0),
    s3Proj(x0+w,o+h,z0+d),
    s3Proj(x0,o+h,z0+d)
  ];
  s3Fill([pts[4],pts[5],pts[6],pts[7]],colors.t);
  const sa=Math.sin(s3Cam.a),ca=Math.cos(s3Cam.a);
  if(sa<0)s3Fill([pts[1],pts[2],pts[6],pts[5]],colors.s1);
  else s3Fill([pts[0],pts[3],pts[7],pts[4]],colors.s1);
  if(ca>0)s3Fill([pts[2],pts[3],pts[7],pts[6]],colors.s2);
  else s3Fill([pts[0],pts[1],pts[5],pts[4]],colors.s2);
  return pts;
}

function s3BodyColors(i){
  if(i===0)return {t:"#ffe082",s1:"#f57f17",s2:"#f9a825"};
  const h=(140-i*3+360)%360;
  return {t:"hsl("+h+",75%,50%)",s1:"hsl("+h+",75%,32%)",s2:"hsl("+h+",75%,22%)"};
}

function drawSnake3(){
  const t=performance.now()/1000;
  let bg=ctx.createLinearGradient(0,0,0,500);
  bg.addColorStop(0,"#0b1a3e");
  bg.addColorStop(0.5,"#2b1d5e");
  bg.addColorStop(1,"#0f0a20");
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,900,500);
  for(let i=0;i<60;i++){
    const tw=0.3+0.4*Math.sin(t*2+i*1.7);
    ctx.globalAlpha=tw;
    ctx.fillStyle="#fff";
    ctx.fillRect((i*137)%900,(i*97)%400,2,2);
  }
  ctx.globalAlpha=1;
  s3Fill([
    s3Proj(S3_X0-18,0,S3_Z0-18),
    s3Proj(S3_X0-18+S3_C*S3_CELL+36,0,S3_Z0-18),
    s3Proj(S3_X0-18+S3_C*S3_CELL+36,0,S3_Z0-18+S3_R*S3_CELL+36),
    s3Proj(S3_X0-18,0,S3_Z0-18+S3_R*S3_CELL+36)
  ],"rgba(0,0,0,.5)");
  for(let gx=0;gx<S3_C;gx++){
    for(let gy=0;gy<S3_R;gy++){
      const x0=S3_X0+gx*S3_CELL;
      const z0=S3_Z0+gy*S3_CELL;
      const col=(gx+gy)%2===0?"#2e7d32":"#388e3c";
      s3Fill([
        s3Proj(x0,0,z0),
        s3Proj(x0+S3_CELL,0,z0),
        s3Proj(x0+S3_CELL,0,z0+S3_CELL),
        s3Proj(x0,0,z0+S3_CELL)
      ],col);
    }
  }
  const drawList=[];
  for(let i=snake3.body.length-1;i>=0;i--){
    const b=snake3.body[i];
    const x0=S3_X0+b.x*S3_CELL;
    const z0=S3_Z0+b.y*S3_CELL;
    const colors=s3BodyColors(i);
    const pc=s3Proj(x0+S3_CELL/2,0,z0+S3_CELL/2);
    drawList.push({d:pc.z,fn:function(){s3Block(x0,z0,S3_CELL,S3_CELL,S3_H,colors,0);}});
  }
  const fx=S3_X0+snake3.food.x*S3_CELL;
  const fz=S3_Z0+snake3.food.y*S3_CELL;
  const fy=Math.sin(t*3)*10+10;
  const fpc=s3Proj(fx+S3_CELL/2,fy,fz+S3_CELL/2);
  drawList.push({d:fpc.z,fn:function(){
    ctx.shadowColor="#ff5252";
    ctx.shadowBlur=18;
    s3Block(fx+S3_CELL*0.2,fz+S3_CELL*0.2,S3_CELL*0.6,S3_CELL*0.6,22,{t:"#ff8a80",s1:"#d32f2f",s2:"#c62828"},fy);
    ctx.shadowBlur=0;
  }});
  drawList.sort(function(a,b){return b.d-a.d;});
  drawList.forEach(function(item){item.fn();});
  const head=snake3.body[0];
  const hx=S3_X0+head.x*S3_CELL;
  const hz=S3_Z0+head.y*S3_CELL;
  const cx=hx+S3_CELL/2,cz=hz+S3_CELL/2;
  const topPts=[
    s3Proj(hx,S3_H,hz),
    s3Proj(hx+S3_CELL,S3_H,hz),
    s3Proj(hx+S3_CELL,S3_H,hz+S3_CELL),
    s3Proj(hx,S3_H,hz+S3_CELL)
  ];
  const cornerG=[
    {x:hx,z:hz},
    {x:hx+S3_CELL,z:hz},
    {x:hx+S3_CELL,z:hz+S3_CELL},
    {x:hx,z:hz+S3_CELL}
  ];
  const dv={x:snake3.dir.x,y:snake3.dir.y};
  const scores=cornerG.map(function(cg){return (cg.x-cx)*dv.x+(cg.z-cz)*dv.y;});
  const order=[0,1,2,3].sort(function(a,b){return scores[b]-scores[a];});
  ctx.fillStyle="#333";
  ctx.shadowBlur=0;
  [order[0],order[1]].forEach(function(k){
    const p=topPts[k];
    const r=Math.max(3,7*p.s);
    ctx.beginPath();
    ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.fill();
  });
  const hue=(t*40)%360;
  ctx.fillStyle="#fff";
  ctx.shadowColor="hsl("+hue+",100%,60%)";
  ctx.shadowBlur=8;
  ctx.font="bold 24px Arial";
  ctx.fillText("🐍 SNAKE 3D",20,40);
  ctx.shadowBlur=0;
  ctx.fillStyle="#ffd84d";
  ctx.font="18px Arial";
  ctx.fillText("Score: "+snake3.score+"   Speed: "+snake3.speed.toFixed(2),20,70);
  ctx.fillStyle="rgba(255,255,255,.6)";
  ctx.font="15px Arial";
  ctx.fillText("ARROWS / WASD to move",20,95);
  if(snake3.dead){
    ctx.fillStyle="rgba(0,0,0,.55)";
    ctx.fillRect(0,0,900,500);
    ctx.fillStyle="#ff5252";
    ctx.shadowColor="#ff5252";
    ctx.shadowBlur=16;
    ctx.font="bold 42px Arial";
    ctx.textAlign="center";
    ctx.fillText("💀 GAME OVER",450,220);
    ctx.shadowBlur=0;
    ctx.fillStyle="#fff";
    ctx.font="24px Arial";
    ctx.fillText("Score: "+snake3.score+"   CLICK TO RESTART",450,270);
    ctx.textAlign="left";
  }
}

canvas.addEventListener("mousedown",function(e){
  if(mode!="snake3")return;
  if(snake3.dead)startSnake3();
});
